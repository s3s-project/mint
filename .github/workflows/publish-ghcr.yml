name: Publish mint image

# Publishing is tag driven: create a tag named yyyymmddhhmm (UTC) on the s3s
# branch and push it. workflow_dispatch rebuilds the same source (for example to
# pick up base image or SDK updates) and labels the image with the current UTC
# minute, exactly like the MinIO image this fork sits next to.
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  REGISTRY_IMAGE: ghcr.io/s3s-project/mint

jobs:
  # Any tag fires this workflow, and the fork also carries upstream's tags, so
  # gate on the s3s build files and on the publish tag shape.
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      image_tag: ${{ steps.check.outputs.image_tag }}
      source_ref: ${{ steps.check.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate the ref and derive the build metadata
        id: check
        run: |
          set -euo pipefail

          if [ ! -f Dockerfile.s3s ]; then
            echo "::notice::$GITHUB_REF_NAME does not point at the s3s branch; nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ] && ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^[0-9]{12}$'; then
            echo "::notice::tag $GITHUB_REF_NAME is not a yyyymmddhhmm publish tag; skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Everything the build reads has to be in the checkout: the pinned SDK
          # revisions, the patches applied to them and the reason each patch is
          # allowed here.
          for required in .sdk-refs patches/README.md; do
            if [ ! -e "$required" ]; then
              echo "::error::$required is missing from $GITHUB_SHA"
              exit 1
            fi
          done

          if ! ls patches/*.patch >/dev/null 2>&1; then
            echo "::error::$GITHUB_SHA has no patches/*.patch files"
            exit 1
          fi

          for pin in $(sed -n 's/^\(MINIO_JS_REF\|MINIO_JAVA_REF\)=\([0-9a-f]*\).*$/\2/p' .sdk-refs); do
            if [ "${#pin}" -ne 40 ]; then
              echo "::error::.sdk-refs holds a revision that is not a full commit id: $pin"
              exit 1
            fi
          done

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            image_tag="$GITHUB_REF_NAME"
          else
            image_tag="$(date -u +%Y%m%d%H%M)"
          fi

          {
            echo "build=true"
            echo "image_tag=$image_tag"
            echo "source_ref=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [guard]
    if: needs.guard.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 only. The upstream install scripts fetch amd64 toolchains -
          # preinstall.sh takes go<version>.linux-amd64.tar.gz and
          # build/mc/install.sh the amd64 client binary - so an arm64 runner
          # fails with "cannot execute binary file: Exec format error". Every
          # consumer (s3s CI on ubuntu-latest, local machines) is amd64, so the
          # second platform is not worth carrying; teaching the upstream
          # scripts about other architectures is out of scope for this fork.
          - platform: linux/amd64
            runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.s3s
          platforms: ${{ matrix.platform }}
          # BuildKit still needs a name for the push even though push-by-digest
          # discards the tag; the manifest list is tagged by the publish job.
          tags: ${{ env.REGISTRY_IMAGE }}
          build-args: |
            MINT_SOURCE_REF=${{ needs.guard.outputs.source_ref }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=mint-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=mint-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [guard, build]
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
        run: |
          # Only the timestamp tag is published. Upstream's mutable edge tag is
          # not reproduced here on purpose: the point of this image is that a
          # consumer pins a digest, so nothing may move underneath it.
          docker buildx imagetools create \
            -t "$REGISTRY_IMAGE:$IMAGE_TAG" \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)
      - name: Inspect
        env:
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
        run: docker buildx imagetools inspect "$REGISTRY_IMAGE:$IMAGE_TAG"
